name: Update and force re-build
on:
  workflow_dispatch:
  schedule:
    - cron: "05 03 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror
          token: ${{ secrets.checkout_token }}
      - name: Update mirror
        id: update
        run: |
          git fetch origin
          git remote add upstream https://github.com/ptitSeb/box64.git
          rev1=`git rev-parse HEAD`
          git pull upstream main
          rev2=`git rev-parse HEAD`
          if [[ $rev1 != $rev2 ]]; then
            echo Upstream updated
            git push origin
            echo "BUILD=true" >> "$GITHUB_OUTPUT"
          else
            echo No upstream update
          fi

      - name: Build box64
#        if: steps.update.outputs.BUILD == 'true'
        run: |
          git checkout origin/build -- ./github-scripts
          mkdir -p build-nightly/final/
          echo foobar > build-nightly/final/box64.zip

      - name: Create release
        uses: "ncipollo/release-action@v1.16.0"
#        if: steps.update.outputs.BUILD == 'true'
        with:
          tag: "box64-latest"
          artifacts: build-nightly/final/box64.zip
          makeLatest: true
          allowUpdates: true
        # uses: "marvinpinto/action-automatic-releases@latest"
